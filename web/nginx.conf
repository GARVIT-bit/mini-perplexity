# One origin for the browser, like Vite's dev proxy: static UI here, /api forwarded to Express.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://server:3001;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Server-Sent Events: pass each event through as it arrives. With buffering on,
        # nginx would hold the answer back and the user would see it all at once at the end.
        proxy_buffering off;
        proxy_cache off;
        # an answer can take a while on a slow model; don't cut the stream at nginx's 60 s default
        proxy_read_timeout 300s;
    }

    # hashed asset files never change: cache them hard; index.html must always be fresh
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
